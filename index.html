let unitKey = "unit1";
let modeId = "learn";
let stars = Number(localStorage.getItem("kids_en_u16_stars") || localStorage.getItem("kids_en_u12_stars") || 0);
let matchSpeak = localStorage.getItem("kids_en_match_speak") !== "0"; // default on
let game = null;
const $ = (id) => document.getElementById(id);
const app = () => $("app");

function saveStars() {
  $("starBox").textContent = `⭐ ${stars}`;
  localStorage.setItem("kids_en_u16_stars", String(stars));
}
function addStar(n = 1) { stars += n; saveStars(); burst(); }
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(x => /en(-|_)US/i.test(x.lang) && /female|samantha|google|zira|aria/i.test(x.name))
    || voices.find(x => /^en/i.test(x.lang)) || null;
}
function speak(text, rate = 0.85, pitch = 1.05) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate; u.pitch = pitch;
  const v = pickVoice(); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function waitSpeak(text, rate, pitch) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis) { resolve(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = rate; u.pitch = pitch;
    const v = pickVoice(); if (v) u.voice = v;
    u.onend = () => resolve(); u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}
async function speakSing(phrases, highlightEls = []) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const melody = [1.15, 1.28, 1.38, 1.22, 1.32, 1.18, 1.4, 1.25];
  for (let i = 0; i < phrases.length; i++) {
    highlightEls.forEach((el, j) => el.classList.toggle("singing", j === i));
    await waitSpeak(phrases[i], 0.72, melody[i % melody.length]);
    await new Promise(r => setTimeout(r, 160));
  }
  highlightEls.forEach(el => el.classList.remove("singing"));
}
function asPhrases(item) {
  if (Array.isArray(item)) return item.map(s => String(s).trim()).filter(Boolean);
  return String(item).split(/(?<=[.?!])\s+/).map(s => s.trim()).filter(Boolean);
}
speechSynthesis?.getVoices?.();
speechSynthesis?.addEventListener?.("voiceschanged", () => {});

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sample(arr, n) { return shuffle(arr).slice(0, n); }
function setBar(p) { $("bar").style.width = `${Math.max(0, Math.min(100, p))}%`; }
function burst() {
  const box = $("confetti");
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("div");
    s.textContent = ["⭐","🎉","✨","🌟"][i % 4];
    s.style.cssText = `position:absolute;left:${20+Math.random()*60}%;top:8%;font-size:${14+Math.random()*16}px;transition:1.8s ease-out;opacity:1;`;
    box.appendChild(s);
    requestAnimationFrame(() => {
      s.style.transform = `translate(${(Math.random()-0.5)*180}px, ${360+Math.random()*160}px) rotate(${Math.random()*360}deg)`;
      s.style.opacity = "0";
    });
    setTimeout(() => s.remove(), 1900);
  }
}

function renderTabs() {
  const unitChips = UNIT_KEYS.map(k =>
    `<button class="chip ${unitKey===k?"active":""}" data-u="${k}">${DATA[k].short}</button>`
  ).join("") + `<button class="chip ${unitKey==="all"?"active":""}" data-u="all">全部合练</button>`;
  $("unitTabs").innerHTML = unitChips;
  $("unitTabs").onclick = (e) => {
    const b = e.target.closest("[data-u]"); if (!b) return;
    unitKey = b.dataset.u; renderTabs(); render();
  };
  $("modeTabs").innerHTML = MODES.map(m =>
    `<button class="chip ${modeId===m.id?"active":""}" data-m="${m.id}">${m.name}</button>`
  ).join("");
  $("modeTabs").onclick = (e) => {
    const b = e.target.closest("[data-m]"); if (!b) return;
    modeId = b.dataset.m; renderTabs(); render();
  };
}

function currentWords() {
  if (unitKey === "all") return UNIT_KEYS.flatMap(k => DATA[k].words);
  return DATA[unitKey].words;
}
function currentUnit() {
  if (unitKey !== "all") return DATA[unitKey];
  return {
    title: "Unit 1–6 全部合练",
    words: currentWords(),
    chants: UNIT_KEYS.flatMap(k => DATA[k].chants),
    letterLines: UNIT_KEYS.flatMap(k => DATA[k].letterLines),
    sentences: UNIT_KEYS.flatMap(k => DATA[k].sentences)
  };
}

  app().innerHTML = `

function startListenGame() {
  let words = currentWords();
  if (words.length > 12) words = sample(words, 12);
  game = { type: "listen", pool: shuffle(words), i: 0, correct: 0, all: currentWords() };
  showListenRound();
}
function showListenRound() {
  const words = game.all;
  if (game.i >= game.pool.length) {
    setBar(100);
    app().innerHTML = `<h2>🎧 完成！</h2><div class="game-box"><div class="big-emoji">🏆</div><div class="prompt">答对 ${game.correct}/${game.pool.length}</div>
      <button class="btn" id="again">再玩一次</button><button class="btn alt" id="nextMode">去图文配对 →</button></div>`;
    if (game.correct === game.pool.length) addStar(3); else if (game.correct >= game.pool.length*0.7) addStar(1);
    $("again").onclick = startListenGame;
    $("nextMode").onclick = () => { modeId = "match"; renderTabs(); render(); };
    return;
  }
  const target = game.pool[game.i];
  const opts = shuffle([target, ...sample(words.filter(w => w.en !== target.en), Math.min(3, words.length-1))]);
  setBar((game.i / game.pool.length) * 100);
  app().innerHTML = `<h2>🎧 听音选词 <span style="color:#9a3412;font-size:.85rem">${game.i+1}/${game.pool.length}</span></h2>
    <p class="hint">先点喇叭听，再选出正确单词。</p>
    <div class="game-box"><button class="btn" id="hear">🔊 再听一遍</button>
    <div class="big-emoji" id="hintEmoji" style="filter:grayscale(1);opacity:.35">❓</div>
    <div class="choices" id="choices"></div><div class="feedback" id="fb"></div></div>`;
  const play = () => speak(target.en); play(); $("hear").onclick = play;
  const box = $("choices");
  opts.forEach(o => {
    const b = document.createElement("button"); b.className = "choice"; b.textContent = o.en;
    b.onclick = () => {
      if (b.disabled) return;
      [...box.children].forEach(x => x.disabled = true);
      if (o.en === target.en) {
        b.classList.add("correct"); $("fb").className="feedback ok";
        $("fb").textContent=`太棒了！${target.emoji} ${target.en}`;
        $("hintEmoji").textContent=target.emoji; $("hintEmoji").style.filter="none"; $("hintEmoji").style.opacity="1";
        game.correct++; addStar(1); setTimeout(()=>{game.i++; showListenRound();}, 850);
      } else {
        b.classList.add("wrong"); $("fb").className="feedback bad"; $("fb").textContent=`答案是 ${target.en}`;
        setTimeout(()=>{game.i++; showListenRound();}, 1000);
      }
    };
    box.appendChild(b);
  });
}

function startMatchGame() {
  const words = sample(currentWords(), Math.min(6, currentWords().length));
  game = { type:"match", left:shuffle(words.map(w=>({...w,side:"emoji"}))), right:shuffle(words.map(w=>({...w,side:"en"}))), picked:null, done:0, total:words.length };
  showMatch();
}
function showMatch() {
  setBar((game.done / game.total) * 100);
  if (game.done >= game.total) {
    app().innerHTML = `<h2>🃏 配对成功！</h2><div class="game-box"><div class="big-emoji">🌟</div><div class="prompt">全部配对完成</div>
      <button class="btn" id="again">再玩一次</button><button class="btn alt" id="nextMode">去拼写闯关 →</button></div>`;
    addStar(2); $("again").onclick = startMatchGame;
    $("nextMode").onclick = () => { modeId="spell"; renderTabs(); render(); };
    return;
  }
  const colors = ["#fecaca","#fed7aa","#fef08a","#bbf7d0","#bfdbfe","#ddd6fe","#fbcfe8"];
  app().innerHTML = `<h2>🃏 图文配对</h2>
    <div class="opt-row">
      <label><input type="checkbox" id="matchSpeakOpt" ${matchSpeak ? "checked" : ""} /> 点击图片/单词时朗读</label>
    </div>
    <p class="hint">先点左边大图，再点右边单词。</p>
    <div class="match-board"><div><div class="match-col-title">大图</div><div class="match-pics" id="left"></div></div>
    <div><div class="match-col-title">单词</div><div class="match-words" id="right"></div></div></div>
    <div class="feedback" id="fb"></div>`;
  const speakOpt = $("matchSpeakOpt");
  if (speakOpt) {
    speakOpt.onchange = () => {
      matchSpeak = speakOpt.checked;
      localStorage.setItem("kids_en_match_speak", matchSpeak ? "1" : "0");
    };
  }
  game.left.forEach((item, idx) => {
    if (item.matched) return;
    const b = document.createElement("button");
    b.className = "pic-tile" + (game.picked && game.picked.en===item.en && game.picked.side===item.side ? " selected":"");
    b.style.background = `linear-gradient(160deg,#fff 0%, ${colors[idx%colors.length]} 100%)`;
    b.innerHTML = `<span class="pic-emoji">${item.emoji}</span><span class="pic-zh">${item.zh.split("/")[0].trim()}</span>`;
    b.onclick = () => onPick(item); $("left").appendChild(b);
  });
  game.right.forEach(item => {
    if (item.matched) return;
    const b = document.createElement("button");
    b.className = "word-tile choice" + (game.picked && game.picked.en===item.en && game.picked.side===item.side ? " selected":"");
    b.textContent = item.en; b.onclick = () => onPick(item); $("right").appendChild(b);
  });
}
function maybeSpeakMatch(word) { if (matchSpeak) speak(word); }
function onPick(item) {
  if (!game.picked) { game.picked = item; showMatch(); maybeSpeakMatch(item.en); return; }
  if (game.picked.side === item.side) { game.picked = item; showMatch(); maybeSpeakMatch(item.en); return; }
  if (game.picked.en === item.en) {
    game.left.forEach(x => { if (x.en===item.en) x.matched=true; });
    game.right.forEach(x => { if (x.en===item.en) x.matched=true; });
    game.done++; game.picked=null; addStar(1); showMatch();
    const fb=$("fb"); if (fb){ fb.className="feedback ok"; fb.textContent="配对成功！"; }
  } else {
    const fb=$("fb"); if (fb){ fb.className="feedback bad"; fb.textContent="不对哦，再试一次"; }
    game.picked=null; setTimeout(showMatch, 400);
  }
}

function startSpellGame() {
  let words = shuffle(currentWords().filter(w => w.en.length <= 12 && !w.en.includes(" ")));
  if (words.length > 10) words = words.slice(0, 10);
  if (!words.length) words = sample(currentWords(), Math.min(8, currentWords().length));
  game = { type:"spell", pool:words, i:0, correct:0 };
  showSpell();
}
function showSpell() {
  if (game.i >= game.pool.length) {
    setBar(100);
    app().innerHTML = `<h2>✍️ 拼写完成</h2><div class="game-box"><div class="big-emoji">🏅</div><div class="prompt">拼对 ${game.correct}/${game.pool.length}</div>
      <button class="btn" id="again">再玩一次</button><button class="btn alt" id="nextMode">去儿歌点读 →</button></div>`;
    addStar(game.correct===game.pool.length?3:1);
    $("again").onclick = startSpellGame;
    $("nextMode").onclick = () => { modeId="chant"; renderTabs(); render(); };
    return;
  }
  const w = game.pool[game.i];
  const hint = w.en[0] + "_".repeat(Math.max(0, w.en.length-1));
  setBar((game.i/game.pool.length)*100);
  app().innerHTML = `<h2>✍️ 拼写闯关 <span style="color:#9a3412;font-size:.85rem">${game.i+1}/${game.pool.length}</span></h2>
    <p class="hint">看图、听发音，拼出单词。</p>
    <div class="game-box"><div class="big-emoji">${w.emoji}</div>
    <div style="color:#6b7280">${w.zh}　提示：${hint}</div>
    <button class="btn ghost" id="hear">🔊 听发音</button>
    <input class="spell-input" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" />
    <div class="actions"><button class="btn" id="check">检查</button><button class="btn ghost" id="skip">不会，下一题</button></div>
    <div class="feedback" id="fb"></div></div>`;
  const inp=$("inp"); inp.focus();
  $("hear").onclick=()=>speak(w.en); speak(w.en);
  const goNext=ok=>{ if(ok){game.correct++; addStar(1);} game.i++; setTimeout(showSpell,650); };
  const check=()=>{
    if (inp.value.trim().toLowerCase()===w.en.toLowerCase()){ $("fb").className="feedback ok"; $("fb").textContent=`正确！${w.en}`; goNext(true); }
    else { $("fb").className="feedback bad"; $("fb").textContent=`再试试，答案是 ${w.en}`; speak(w.en); }
  };
  $("check").onclick=check; inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
  $("skip").onclick=()=>{ $("fb").className="feedback bad"; $("fb").textContent=`答案：${w.en}`; goNext(false); };
}

function renderChant() {
  const u = currentUnit();
  setBar(0);
  let songs = [
    ...u.chants.map((t,i)=>({title:`儿歌 ${i+1}`, phrases:asPhrases(t)})),
    ...u.letterLines.map((t,i)=>({title:`字母歌 ${i+1}`, phrases:asPhrases(t)}))
  ];
  if (unitKey==="all" && songs.length>10) songs = songs.slice(0,10);
  app().innerHTML = `<h2>🎤 儿歌 & 字母歌</h2><p class="hint">点短句听唱；「唱整首」带起伏语调。</p><div id="chants"></div>`;
  const box=$("chants");
  songs.forEach((song,sIdx)=>{
    const block=document.createElement("div"); block.className="chant-block";
    block.innerHTML=`<h3>🎵 ${song.title}</h3><div class="actions">
      <button class="btn sing-all" data-s="${sIdx}">🎶 唱整首</button>
      <button class="btn ghost slow-all" data-s="${sIdx}">🐢 慢速跟读</button></div>
      <div class="phrases" data-s="${sIdx}"></div>`;
    const pb=block.querySelector(".phrases");
    song.phrases.forEach((p,pIdx)=>{
      const line=document.createElement("div"); line.className="phrase-line";
      line.dataset.s=String(sIdx); line.dataset.p=String(pIdx);
      line.innerHTML=`<span class="num">${pIdx+1}</span><span>${p}</span>`;
      pb.appendChild(line);
    });
    box.appendChild(block);
  });
  box.onclick = async (e) => {
    const singAll=e.target.closest(".sing-all");
    const slowAll=e.target.closest(".slow-all");
    const line=e.target.closest(".phrase-line");
    if (singAll) {
      const sIdx=Number(singAll.dataset.s);
      const els=[...box.querySelectorAll(`.phrase-line[data-s="${sIdx}"]`)];
      await speakSing(songs[sIdx].phrases, els); addStar(1); return;
    }
    if (slowAll) {
      const sIdx=Number(slowAll.dataset.s);
      const els=[...box.querySelectorAll(`.phrase-line[data-s="${sIdx}"]`)];
      window.speechSynthesis.cancel();
      for (let i=0;i<songs[sIdx].phrases.length;i++){
        els.forEach((el,j)=>el.classList.toggle("singing", j===i));
        await waitSpeak(songs[sIdx].phrases[i], 0.62, 1.08);
        await new Promise(r=>setTimeout(r,220));
      }
      els.forEach(el=>el.classList.remove("singing")); addStar(1); return;
    }
    if (line) {
      const sIdx=Number(line.dataset.s), pIdx=Number(line.dataset.p);
      const els=[...box.querySelectorAll(`.phrase-line[data-s="${sIdx}"]`)];
      const melody=[1.15,1.28,1.38,1.22,1.32,1.18,1.4,1.25];
      els.forEach((el,j)=>el.classList.toggle("singing", j===pIdx));
      await waitSpeak(songs[sIdx].phrases[pIdx], 0.72, melody[pIdx%melody.length]);
      els.forEach(el=>el.classList.remove("singing"));
    }
  };
}

    return;
  }
  const s=game.pool[game.i];
  const words=s.en.replace(/[.,!?]/g,"").split(/\s+/);
  const bank=shuffle(words.map(w=>({w, used:false})));
  game.answer=[]; game.targetWords=words;
  setBar((game.i/game.pool.length)*100);
  app().innerHTML = `<h2>🧩 句子拼拼乐 <span style="color:#9a3412;font-size:.85rem">${game.i+1}/${game.pool.length}</span></h2>
    <p class="hint">中文：${s.zh}　先听原句，再按顺序点词。</p>

    <div class="scramble-answer" id="answer"></div><div class="scramble-bank" id="bank"></div>
    <div class="actions"><button class="btn alt" id="check">检查句子</button><button class="btn ghost" id="skip">看答案</button></div>
    <div class="feedback" id="fb"></div>`;
  $("hear").onclick=()=>speak(s.en,0.8); speak(s.en,0.8);
  const paint=()=>{
    $("answer").innerHTML=game.answer.map((w,i)=>`<button class="word-chip" data-a="${i}">${w}</button>`).join("")||'<span style="color:#9ca3af">点下面的词拼到这里</span>';
    $("bank").innerHTML=bank.map((item,i)=>item.used?"":`<button class="word-chip" data-b="${i}">${item.w}</button>`).join("");
  };
  paint();
  app().onclick=(e)=>{
    const b=e.target.closest("[data-b]"); const a=e.target.closest("[data-a]");
    if(b){ const i=Number(b.dataset.b); bank[i].used=true; game.answer.push(bank[i].w); paint(); }
    if(a){ const i=Number(a.dataset.a); const word=game.answer.splice(i,1)[0]; const item=bank.find(x=>x.w===word&&x.used); if(item) item.used=false; paint(); }
  };
  $("reset").onclick=()=>{ game.answer=[]; bank.forEach(x=>x.used=false); paint(); $("fb").textContent=""; };
  $("check").onclick=()=>{
    const got=game.answer.join(" ").toLowerCase();
    const want=game.targetWords.join(" ").toLowerCase();
    if(got===want){ $("fb").className="feedback ok"; $("fb").textContent="完美！"; game.correct++; addStar(1); setTimeout(()=>{game.i++; showSentence();},850); }
    else { $("fb").className="feedback bad"; $("fb").textContent="顺序还不对，再听听～"; speak(s.en,0.75); }
  };
  $("skip").onclick=()=>{ $("fb").className="feedback bad"; $("fb").textContent=`答案：${s.en}`; speak(s.en,0.75); setTimeout(()=>{game.i++; showSentence();},1300); };
}

function render() {
  window.speechSynthesis?.cancel();
  if (modeId==="learn") return renderLearn();
  if (modeId==="listen") return startListenGame();
  if (modeId==="match") return startMatchGame();
  if (modeId==="spell") return startSpellGame();
  if (modeId==="chant") return renderChant();
  if (modeId==="sentence") return startSentenceGame();
}

(function(){
  const ua = navigator.userAgent || "";
  const inWeChat = /MicroMessenger/i.test(ua);
  const tip = document.getElementById("openTip");
  if (tip && inWeChat) tip.classList.add("show");
})();

saveStars(); renderTabs(); render();
</script>
</body></html>
